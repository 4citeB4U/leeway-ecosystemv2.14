services:
  agent-lee:
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import sys,urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); response=opener.open('http://127.0.0.1:8080/health',timeout=4); status=int(getattr(response,'status',0)); response.close(); sys.exit(0 if 200 <= status < 400 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 75s
      start_interval: 5s
