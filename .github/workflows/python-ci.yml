name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  agentlee-loader-windows:
    name: AgentLee loader (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywin32
      - name: Verify import-safe loader contract
        shell: pwsh
        run: python -m unittest discover -s agent-lee-coding-mode/runtime -p test_agent_lee_service_loader.py -v

  cerebral-imports-windows:
    name: Cerebral imports (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install import-contract dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install flask psutil pywin32 pygetwindow requests mcp pillow python-dotenv screeninfo flask_cors websockets numpy sounddevice
      - name: Run non-interactive Cerebral import contracts
        shell: pwsh
        working-directory: Cerebral
        run: |
          python test_all_imports.py
