name: Integration CI (manual)

on:
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests (requires router + runtime available)'
        required: true
        default: 'false'

jobs:
  integration:
    if: ${{ github.event.inputs.run_integration == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install pytest & requests
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
      - name: Run router integration tests (skipped unless RUN_ROUTER_INTEGRATION=1)
        env:
          RUN_ROUTER_INTEGRATION: '1'
        run: |
          pytest -q tests/test_router_integration.py -q || true
      - name: Run skills audit
        run: |
          node scripts/audit_skills.mjs || true
