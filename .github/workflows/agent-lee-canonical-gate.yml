name: Agent Lee Canonical Gate

on:
  workflow_dispatch:

jobs:
  canonical-gate:
    # This gate validates an installed, multi-repository LeeWay workspace and
    # must not run on an arbitrary pull-request checkout. It remains a real
    # Windows qualification, dispatched only after a labeled canonical host is
    # online and selected by its owner.
    runs-on: [self-hosted, windows, leeway-canonical]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run canonical identity gate
        run: |
          powershell.exe -ExecutionPolicy Bypass -File ".\agent-lee-coding-mode\tools\validate-agent-lee-canonical-gate.ps1"
