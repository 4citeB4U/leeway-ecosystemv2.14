<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeeWay Ecosystem Map Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  h1 { color: #3b82f6; margin-bottom: 8px; }
  .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
  .controls { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
  .controls button {
    padding: 8px 16px; border: 1px solid #334155; border-radius: 6px;
    background: #1e293b; color: #e2e8f0; cursor: pointer; font-size: 13px;
    transition: all 0.2s;
  }
  .controls button:hover { background: #334155; border-color: #3b82f6; }
  .controls button.active { background: #1d4ed8; border-color: #3b82f6; }
  .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-card {
    padding: 12px 20px; border-radius: 8px; background: #1e293b;
    border: 1px solid #334155; min-width: 120px;
  }
  .stat-card .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
  .stat-card .value { font-size: 24px; font-weight: bold; color: #3b82f6; }
  .stat-card .value.green { color: #22c55e; }
  .stat-card .value.yellow { color: #eab308; }
  .stat-card .value.red { color: #ef4444; }
  #mermaid-container {
    background: #1e293b; border-radius: 12px; padding: 24px;
    border: 1px solid #334155; overflow-x: auto; min-height: 400px;
  }
  #node-detail {
    margin-top: 24px; background: #1e293b; border-radius: 12px;
    border: 1px solid #334155; padding: 20px; display: none;
  }
  #node-detail h3 { color: #3b82f6; margin-bottom: 12px; }
  #node-detail .field { margin-bottom: 8px; }
  #node-detail .field-label { color: #94a3b8; font-size: 12px; text-transform: uppercase; }
  #node-detail .field-value { color: #e2e8f0; }
  .node-card { margin-bottom: 8px; }
  #search-box {
    padding: 8px 16px; border: 1px solid #334155; border-radius: 6px;
    background: #0f172a; color: #e2e8f0; font-size: 13px; flex: 1; min-width: 200px;
  }
  #search-box::placeholder { color: #64748b; }
  .mermaid svg { max-width: 100%; height: auto; }
  .mermaid .node rect, .mermaid .node circle, .mermaid .node ellipse, .mermaid .node polygon {
    stroke-width: 2px !important;
  }
  .loading { text-align: center; padding: 60px; color: #64748b; }
</style>
</head>
<body>
<h1>LeeWay Ecosystem Map</h1>
<p class="subtitle">Living architecture map of the LeeWay Ecosystem</p>

<div class="stats" id="stats"></div>

<div class="controls">
  <button class="active" data-diagram="simple" onclick="loadDiagram('simple')">Simple</button>
  <button data-diagram="clustered" onclick="loadDiagram('clustered')">Clustered</button>
  <button data-diagram="detailed" onclick="loadDiagram('detailed')">Detailed</button>
  <input type="text" id="search-box" placeholder="Search nodes..." oninput="filterNodes(this.value)">
  <button onclick="showAllNodes()">Node List</button>
</div>

<div id="mermaid-container">
  <div class="loading">Loading diagram...</div>
</div>

<div id="node-detail"></div>

<script>
let mapData = null;
let currentDiagram = 'simple';

async function loadMap() {
  try {
    const resp = await fetch('ecosystem-map.json');
    mapData = await resp.json();
    renderStats();
    loadDiagram('simple');
  } catch (e) {
    document.getElementById('mermaid-container').innerHTML =
      `<div class="loading">Error loading ecosystem-map.json: ${e.message}</div>`;
  }
}

function renderStats() {
  const { nodes, relationships, metadata } = mapData;
  const proven = nodes.filter(n => n.truthLevel === 'PROVEN').length;
  const partial = nodes.filter(n => n.truthLevel === 'PARTIALLY_PROVEN').length;
  const inferred = nodes.filter(n => n.truthLevel === 'INFERRED').length;
  const live = nodes.filter(n =>
    ['LIVE_READ_ONLY', 'LIVE_WRITE_BOUNDED', 'END_TO_END_VALIDATED', 'PRODUCTION_READY', 'UI_INTEGRATED'].includes(n.status)
  ).length;
  const blocked = nodes.filter(n => n.status === 'BLOCKED' || n.status === 'DEGRADED').length;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="label">Nodes</div><div class="value">${nodes.length}</div></div>
    <div class="stat-card"><div class="label">Relationships</div><div class="value">${relationships.length}</div></div>
    <div class="stat-card"><div class="label">Proven</div><div class="value green">${proven}</div></div>
    <div class="stat-card"><div class="label">Partial</div><div class="value yellow">${partial}</div></div>
    <div class="stat-card"><div class="label">Inferred</div><div class="value">${inferred}</div></div>
    <div class="stat-card"><div class="label">Live</div><div class="value green">${live}</div></div>
    <div class="stat-card"><div class="label">Blocked</div><div class="value red">${blocked}</div></div>
    <div class="stat-card"><div class="label">Known Gaps</div><div class="value red">${metadata.knownGapCount}</div></div>
  `;
}

async function loadDiagram(type) {
  currentDiagram = type;
  document.querySelectorAll('.controls button[data-diagram]').forEach(b => {
    b.classList.toggle('active', b.dataset.diagram === type);
  });

  const container = document.getElementById('mermaid-container');
  container.innerHTML = '<div class="loading">Rendering diagram...</div>';

  try {
    const resp = await fetch(`generated/ecosystem-map-${type}.mmd`);
    const mermaidText = await resp.text();

    container.innerHTML = '<div class="mermaid"></div>';
    const mermaidEl = container.querySelector('.mermaid');
    mermaidEl.textContent = mermaidText;

    mermaid.run({ nodes: [mermaidEl] });

    mermaidEl.addEventListener('click', (e) => {
      const target = e.target.closest('.node') || e.target.closest('g.node');
      if (target) {
        const id = target.id;
        if (id && mapData) {
          const node = mapData.nodes.find(n => id.endsWith(n.id));
          if (node) showNodeDetail(node);
        }
      }
    });
  } catch (e) {
    container.innerHTML = `<div class="loading">Error loading diagram: ${e.message}</div>`;
  }
}

function showNodeDetail(node) {
  const detail = document.getElementById('node-detail');
  detail.style.display = 'block';
  detail.innerHTML = `
    <h3>${node.name} <span style="font-size:12px;color:#94a3b8;font-weight:normal">(${node.id})</span></h3>
    <div class="field"><div class="field-label">Category</div><div class="field-value">${node.category}</div></div>
    <div class="field"><div class="field-label">Status</div><div class="field-value">${node.status}</div></div>
    <div class="field"><div class="field-label">Truth Level</div><div class="field-value">${node.truthLevel}</div></div>
    ${node.description ? `<div class="field"><div class="field-label">Description</div><div class="field-value">${node.description}</div></div>` : ''}
    ${node.knownGaps && node.knownGaps.length ? `<div class="field"><div class="field-label">Known Gaps</div><div class="field-value">${node.knownGaps.join(', ')}</div></div>` : ''}
    ${node.evidence && node.evidence.length ? `<div class="field"><div class="field-label">Evidence</div><div class="field-value">${node.evidence.join(', ')}</div></div>` : ''}
    ${node.ports && node.ports.length ? `<div class="field"><div class="field-label">Ports</div><div class="field-value">${node.ports.join(', ')}</div></div>` : ''}
    ${node.containers && node.containers.length ? `<div class="field"><div class="field-label">Containers</div><div class="field-value">${node.containers.join(', ')}</div></div>` : ''}
    <div style="margin-top:12px;">
      <h4 style="color:#94a3b8;font-size:12px;text-transform:uppercase;margin-bottom:4px;">Dependencies</h4>
      <ul style="list-style:none;padding:0;">
        ${node.dependencies && node.dependencies.length
          ? node.dependencies.map(d => `<li style="margin:2px 0">${getNodeLink(d)}</li>`).join('')
          : '<li style="color:#64748b">None</li>'}
      </ul>
    </div>
  `;
}

function getNodeLink(id) {
  if (!mapData) return id;
  const node = mapData.nodes.find(n => n.id === id);
  return node
    ? `<a href="#" onclick="showNodeDetail(mapData.nodes.find(n => n.id === '${id}'));return false;" style="color:#3b82f6">${node.name}</a>`
    : id;
}

function filterNodes(query) {
  if (!mapData || !query) return;
  const q = query.toLowerCase();
  const matches = mapData.nodes.filter(n =>
    n.name.toLowerCase().includes(q) || n.id.includes(q) || (n.description && n.description.toLowerCase().includes(q))
  );
  if (matches.length > 0) {
    showNodeDetail(matches[0]);
  }
}

function showAllNodes() {
  if (!mapData) return;
  const detail = document.getElementById('node-detail');
  detail.style.display = 'block';
  detail.innerHTML = `
    <h3>All Nodes (${mapData.nodes.length})</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:12px;">
      ${mapData.nodes.map(n => `
        <div class="node-card" style="padding:10px;border:1px solid #334155;border-radius:6px;cursor:pointer"
             onclick="showNodeDetail(mapData.nodes.find(x => x.id === '${n.id}'))">
          <div style="font-weight:bold;color:#e2e8f0">${n.name}</div>
          <div style="font-size:12px;color:#94a3b8">${n.category} | ${n.status} | ${n.truthLevel}</div>
        </div>
      `).join('')}
    </div>
  `;
}

mermaid.initialize({
  startOnLoad: false,
  theme: 'dark',
  themeVariables: {
    background: '#1e293b',
    primaryColor: '#1e40af',
    primaryBorderColor: '#3b82f6',
    primaryTextColor: '#e2e8f0',
    lineColor: '#475569',
    secondaryColor: '#1e293b',
    tertiaryColor: '#0f172a',
    fontSize: '12px'
  }
});

loadMap();
</script>
</body>
</html>
