<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Agent Lee Multitask Proof</title>
<style>
  html, body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #080b14;
    color: white;
    font-family: Segoe UI, Arial, sans-serif;
  }
  h1 {
    margin: 32px 44px 8px;
    font-size: 44px;
  }
  .sub {
    margin: 0 44px;
    font-size: 22px;
    color: #b9c6ff;
  }
  .target {
    position: absolute;
    width: 300px;
    height: 300px;
    margin-left: -150px;
    margin-top: -150px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    font-size: 64px;
    font-weight: 900;
    background: rgba(255,255,255,0.16);
    border: 10px solid rgba(255,255,255,0.9);
    box-shadow: 0 0 45px rgba(255,255,255,0.28);
  }
  .target:hover {
    background: rgba(0,255,140,0.7);
    box-shadow: 0 0 140px rgba(0,255,140,1);
    transform: scale(1.12);
  }
  #one { left: 22vw; top: 42vh; }
  #two { left: 50vw; top: 42vh; }
  #three { left: 78vw; top: 42vh; }
  #cursorDot {
    position: fixed;
    width: 44px;
    height: 44px;
    margin-left: -22px;
    margin-top: -22px;
    border-radius: 999px;
    background: rgba(255, 230, 0, 0.98);
    box-shadow: 0 0 55px rgba(255, 230, 0, 1);
    pointer-events: none;
    z-index: 9999;
  }
  .status {
    position: fixed;
    left: 44px;
    right: 44px;
    bottom: 34px;
    padding: 20px 26px;
    border-radius: 18px;
    font-size: 28px;
    background: rgba(0,0,0,0.72);
  }
</style>
</head>
<body>
  <h1>Agent Lee Multitask Proof</h1>
  <div class="sub">Agent Lee must move across 1, 2, and 3, then capture and open a screenshot.</div>
  <div class="target" id="one">1</div>
  <div class="target" id="two">2</div>
  <div class="target" id="three">3</div>
  <div id="cursorDot"></div>
  <div class="status" id="status">Waiting for real cursor movement...</div>

<script>
  const dot = document.getElementById("cursorDot");
  const status = document.getElementById("status");

  document.addEventListener("mousemove", (event) => {
    dot.style.left = event.clientX + "px";
    dot.style.top = event.clientY + "px";
    status.textContent = "Real cursor at X=" + event.clientX + ", Y=" + event.clientY;
  });
</script>
</body>
</html>
