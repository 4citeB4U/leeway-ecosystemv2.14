<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LeeWay Digital Brain - Diagnostic Viewer</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  #status { color:var(--muted); font-size:12px; }
  input[type=search] { flex:1; max-width:320px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#0d1117; color:var(--text); }
  main { display:flex; height: calc(100vh - 54px); }
  #canvas { flex:1; position:relative; }
  #svg { width:100%; height:100%; }
  #panel { width:340px; background:var(--panel); border-left:1px solid var(--line); padding:12px; overflow:auto; font-size:12px; }
  #panel h2 { font-size:13px; margin:4px 0 8px; }
  #panel .field { margin:6px 0; color:var(--muted); }
  #panel .field b { color:var(--text); display:inline-block; min-width:90px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
  .swatch { display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .node circle { stroke:#0d1117; stroke-width:1.2; cursor:pointer; }
  .node text { font-size:9px; fill:var(--muted); pointer-events:none; }
  .node.hot circle { stroke:#58a6ff; stroke-width:2.5; }
  .link { stroke:#30363d; stroke-width:0.6; }
  .link.hot { stroke:#58a6ff; stroke-width:1.4; }
  .hidden { display:none !important; }
  .note { color:var(--muted); font-size:11px; margin-top:10px; border-top:1px solid var(--line); padding-top:8px; }
</style>
</head>
<body>
<header>
  <h1>LeeWay Digital Brain</h1>
  <span id="status">loading...</span>
  <input type="search" id="q" placeholder="search the brain...">
</header>
<main>
  <div id="canvas"><svg id="svg"></svg></div>
  <aside id="panel">
    <h2>Node Inspector</h2>
    <div id="inspector"><div class="note">Click a node to inspect it. This is a read-only diagnostic view of the governed brain graph.</div></div>
  </aside>
</main>
<script>
const COLORS = {
  standards: "#58a6ff", governance: "#d29922", architecture: "#3fb950",
  evidence: "#f78166", knowledge: "#bc8cff", user: "#36c5f0", ecosystem: "#6e7681"
};
let nodes = [], links = [], byId = new Map(), sel = null;

const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");

function el(tag, attrs, parent) {
  const e = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  (parent || svg).appendChild(e);
  return e;
}

async function load() {
  const [graph, health] = await Promise.all([
    fetch("/brain/graph.json").then(r => r.json()),
    fetch("/brain/health").then(r => r.json())
  ]);
  nodes = graph.nodes; links = graph.links;
  nodes.forEach(n => byId.set(n.id, n));
  document.getElementById("status").textContent =
    `${nodes.length} nodes, ${links.length} links  |  svc ${health.status}  |  ` +
    `root ${health.leewayRoot}  |  ollama ${health.ollama}${health.llmModel ? " | model " + health.llmModel : ""}`;
  buildLegend(graph.graph.domains);
  layout();
}

function buildLegend(domains) {
  const box = document.createElement("div");
  box.className = "legend";
  (domains || []).forEach(d => {
    const it = document.createElement("span");
    it.className = "swatch";
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = COLORS[d] || "#6e7681";
    it.append(dot, d);
    box.appendChild(it);
  });
  document.getElementById("status").after(box);
}

function layout() {
  const w = svg.clientWidth, h = svg.clientHeight;
  nodes.forEach(n => { n.__pos = { x: w / 3 + Math.random() * w / 3, y: h / 3 + Math.random() * h / 3, dx: 0, dy: 0 }; });
  const deg = new Map(nodes.map(n => [n.id, 0]));
  links.forEach(l => { deg.set(l.source, (deg.get(l.source) || 0) + 1); deg.set(l.target, (deg.get(l.target) || 0) + 1); });
  const k = Math.sqrt(w * h / Math.max(links.length + nodes.length, 1)) * 0.9;
  for (let iter = 0; iter < 500; iter++) {
    nodes.forEach(n => {
      const p = n.__pos; p.dx = 0; p.dy = 0;
      nodes.forEach(m => {
        if (m.id === n.id) return;
        const q = m.__pos;
        let dx = p.x - q.x, dy = p.y - q.y;
        let d2 = dx * dx + dy * dy || 1;
        const f = Math.min(k * k / d2, 300);
        const dist = Math.sqrt(d2);
        p.dx += dx / dist * f; p.dy += dy / dist * f;
      });
    });
    links.forEach(l => {
      const p = byId.get(l.source).__pos, q = byId.get(l.target).__pos;
      let dx = q.x - p.x, dy = q.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = (dist - k) * 0.02;
      p.dx += dx / dist * f; p.dy += dy / dist * f;
      q.dx -= dx / dist * f; q.dy -= dy / dist * f;
    });
    nodes.forEach(n => {
      const p = n.__pos;
      p.x = Math.max(8, Math.min(w - 8, p.x + p.dx));
      p.y = Math.max(8, Math.min(h - 8, p.y + p.dy));
    });
  }
  render(deg);
}

function render(deg) {
  svg.replaceChildren();
  const g = el("g");
  links.forEach(l => {
    const line = el("line", {
      x1: pos(l.source).x, y1: pos(l.source).y,
      x2: pos(l.target).x, y2: pos(l.target).y,
      class: "link", "data-s": l.source, "data-t": l.target
    }, g);
  });
  nodes.forEach(n => {
    const grp = el("g", { class: "node", "data-id": n.id, transform: `translate(${pos(n.id).x},${pos(n.id).y})` }, g);
    const r = Math.min(14, 3 + Math.sqrt(deg.get(n.id) || 1) * 3);
    el("circle", { r, fill: COLORS[n.domain] || "#6e7681" }, grp);
    el("text", { y: r + 10, "text-anchor": "middle" }, grp).textContent = n.label.length > 22 ? n.label.slice(0, 22) + "…" : n.label;
    grp.addEventListener("click", () => inspect(n, r));
  });
  svg.appendChild(g);
}

function pos(id) {
  const found = byId.get(id);
  return found && found.__pos ? found.__pos : { x: 0, y: 0, dx: 0, dy: 0 };
}

async function inspect(n, r) {
  sel = n;
  const panel = document.getElementById("inspector");
  panel.innerHTML = `<h2>${escapeHtml(n.label)}</h2>
    <div class="field"><b>id</b> ${escapeHtml(n.id)}</div>
    <div class="field"><b>domain</b> ${escapeHtml(n.domain)}</div>
    <div class="field"><b>type</b> ${escapeHtml(n.type)}</div>
    <div class="field"><b>source</b> ${escapeHtml(n.canonical_id || "")}</div>`;
  try {
    const detail = await fetch(`/brain/node/${encodeURIComponent(n.id)}`).then(r => r.json());
    if (detail.description) panel.innerHTML += `<div class="field"><b>about</b> ${escapeHtml(String(detail.description).slice(0, 400))}</div>`;
    if (detail.source_path) panel.innerHTML += `<div class="field"><b>path</b> ${escapeHtml(detail.source_path)}</div>`;
    if (detail.provenance && detail.provenance.length) {
      panel.innerHTML += `<div class="field"><b>provenance</b> ${detail.provenance.map(p => escapeHtml(p.kind + ":" + p.source)).join(", ")}</div>`;
    }
    if (detail.tags_json && detail.tags_json.length) panel.innerHTML += `<div class="field"><b>tags</b> ${detail.tags_json.map(t => "#" + escapeHtml(t)).join(" ")}</div>`;
  } catch (err) {
    panel.innerHTML += `<div class="note">detail fetch failed: ${escapeHtml(String(err))}</div>`;
  }
  document.querySelectorAll(".node").forEach(g => g.classList.remove("hot"));
  document.querySelectorAll(".link").forEach(l => l.classList.remove("hot"));
  const grp = document.querySelector(`.node[data-id="${CSS.escape(n.id)}"]`);
  if (grp) grp.classList.add("hot");
  document.querySelectorAll(".link").forEach(l => {
    if (l.dataset.s === n.id || l.dataset.t === n.id) l.classList.add("hot");
  });
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

document.getElementById("q").addEventListener("input", async e => {
  const q = e.target.value.trim();
  if (q.length < 2) { document.querySelectorAll(".node").forEach(g => g.classList.remove("hidden")); return; }
  const res = await fetch(`/brain/search?q=${encodeURIComponent(q)}`).then(r => r.json());
  const hot = new Set(res.results.map(r => r.id));
  document.querySelectorAll(".node").forEach(g => {
    g.classList.toggle("hidden", !hot.has(g.dataset.id));
  });
});

window.addEventListener("resize", layout);
load().catch(err => {
  document.getElementById("status").textContent = "load failed: " + err;
});
</script>
</body>
</html>
