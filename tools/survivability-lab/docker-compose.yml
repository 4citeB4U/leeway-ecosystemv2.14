services:
  prometheus:
    image: prom/prometheus:latest
    container_name: leeway-survivability-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: leeway-survivability-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: leeway
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: leeway-survivability-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./prometheus.yml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  toxiproxy:
    image: shopify/toxiproxy:latest
    container_name: leeway-survivability-toxiproxy
    ports:
      - "8474:8474"
      - "8666:8666"
    restart: unless-stopped
