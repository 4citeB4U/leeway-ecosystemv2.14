apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: leeway-survivability-lab
servers: 1
agents: 2
kubeAPI:
  hostPort: "6550"
ports:
  - port: 30080:80
    nodeFilters:
      - loadbalancer
  - port: 30443:443
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: "120s"
    disableLoadbalancer: false
